name: iOS CI

on:
  push:
    branches: [ivan-original, "ivan/**"]
  pull_request:
    branches: [ivan-original]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Architecture check (SDK only inside the Data layer)
        run: |
          if grep -rl "import BWellSDK" bwell-swift-ios/bwell-swift-ios | grep -v "/Data/"; then
            echo "::error::import BWellSDK found outside the Data layer"
            exit 1
          fi

      - name: Build and test
        working-directory: bwell-swift-ios
        run: |
          xcodebuild test \
            -project bwell-swift-ios.xcodeproj \
            -scheme bwell-swift-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
